user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Gzip сжатие статики для ускорения загрузки страниц
    gzip on;
    gzip_http_version 1.1;
    gzip_disable "MSIE [1-6]\.";
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 5;

    server {
        listen 80;
        server_name localhost;

        # 1. Раздача статики Vue приложения
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # 2. Проксирование запросов к Spring Boot API (через хост-мост Podman)
        location /api/ {
            proxy_pass http://host.containers.internal:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Настройки безопасности cookie (Secure убран для локального HTTP)
            proxy_cookie_path / "/; HttpOnly; SameSite=Strict";
        }

        # 3. Проксирование WebSocket соединений (для STOMP/мессенджера)
        location /ws {
            proxy_pass http://host.containers.internal:8080/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймаут для поддержания WebSocket соединений активными
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 4. Проксирование медиа-ресурсов напрямую в локальный MinIO
        location /media/ {
            proxy_pass http://host.containers.internal:9000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Лимит размера загружаемого файла (обложки/аватары)
            client_max_body_size 50M;
        }

        # Страницы ошибок
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}