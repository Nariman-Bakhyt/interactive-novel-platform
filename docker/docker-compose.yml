services:

  postgres:
    image: postgres:18.3-alpine
    container_name: my_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./postgres_data:/var/lib/postgresql:Z
    restart: always

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: my_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: "http://${HOST_IP}:9000"
      MINIO_BROWSER_REDIRECT_URL: "http://${HOST_IP}:9001"
    volumes:
      - ./minio_data:/data:Z
    command: server /data --console-address ":9001"
    restart: always

  valkey:
    image: valkey/valkey:9.0.3-alpine
    container_name: my_valkey
    ports:
      - "6379:6379"
    command: >
      valkey-server 
      --requirepass ${VALKEY_PASSWORD} 
      --save 60 1 
      --loglevel warning 
      --maxmemory 1024mb 
      --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 1024M
    volumes:
      - ./valkey_data:/data:Z
    restart: always