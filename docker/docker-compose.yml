services:

  postgres:
    image: postgres:18.3-alpine
    container_name: my_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Hulk
      POSTGRES_DB: website
    volumes:
      - ./postgres_data:/var/lib/postgresql:Z

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: my_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Admin123453421
    volumes:
      - ./minio_data:/data:Z
    command: server /data --console-address ":9001"

  valkey:
    image: valkey/valkey:9.0.3-alpine
    container_name: my_valkey
    ports:
      - "6379:6379"
    # Для безопасности можно добавить пароль, но для локальной разработки обычно оставляют так
    command: valkey-server  --requirepass Hulk --save 60 1 --loglevel warning
    volumes:
      - ./valkey_data:/data:Z
    restart: always