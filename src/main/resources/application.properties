spring.application.name=InteractiveNovelPlatform

# Включение виртуальных потоков (Project Loom) под Java 21+
spring.threads.virtual.enabled=true

# Лимиты на загрузку файлов (аватары, обложки книг)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Настройка подключения к PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:website}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Настройки Hibernate и JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Миграции базы данных Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Стратегия обработки прокси-заголовков (необходимо для Nginx)
server.forward-headers-strategy=framework

# Настройки CORS (подтягиваются из .env или дефолт)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:5173}

# Инфраструктура MinIO S3
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.accessKey=${MINIO_ACCESS_KEY:minioadmin}
minio.secretKey=${MINIO_SECRET_KEY:minioadmin}
minio.bucketName=${MINIO_BUCKET_NAME:media}

# Пути к медиаресурсам
app.storage.base-url=/media/${minio.bucketName}
app.storage.default-avatar=${app.storage.base-url}/avatars/default-avatar.webp
app.storage.default-cover=${app.storage.base-url}/covers/default-cover.webp

# Настройка Redis (для Rate Limiting / Token Bucket и сессий)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:postgres}
spring.data.redis.timeout=2000

# Настройка почтового сервиса (Mail)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:dev@example.com}
spring.mail.password=${MAIL_PASSWORD:devpassword}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Криптографические секреты и крипто-соль (Pepper)
app.guest.secret=${APP_GUEST_SECRET:guest_secret_key_1234567890_default}
jwt.secret=${JWT_SECRET_KEY:dGhpcy1pcy1hLXNlY3VyZS0yNTYtYml0LXNlY3JldC1rZXktZm9yLWp3dC10b2tlbnM=}
jwt.expiration=${JWT_EXPIRATION_MS:604800000}
app.security.password.pepper=${PASSWORD_PEPPER:default_password_pepper_key_123}