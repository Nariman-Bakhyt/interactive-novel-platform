user root;
worker_processes auto;

error_log /usr/local/openresty/nginx/logs/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /usr/local/openresty/nginx/logs/access.log main;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_http_version 1.1;
    gzip_disable "MSIE [1-6]\.";
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 5;

    limit_req_zone $binary_remote_addr zone=challenge_limit:10m rate=2000r/m;

    # 1. Сервер для обработки обычного HTTP (Редирект на HTTPS)
    server {
        listen 80;
        listen [::]:80;
        server_name wenlib.com localhost;

        return 301 https://$host$request_uri;
    }

    # 2. Основной защищенный сервер HTTPS
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;

        server_name wenlib.com localhost;

        ssl_certificate     /etc/letsencrypt/live/wenlib.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wenlib.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        set $fingerprint_salt "WénLib_Backend_Secret_2026_Salt!";

        # Статика фронтенда
        location / {
            #auth_basic "WénWorld Enterprise Protected Zone";
            #auth_basic_user_file /usr/local/openresty/nginx/conf/.htpasswd;
            sub_filter 'WEN_POW_SKIP' '$skip_ch';
            sub_filter 'WEN_POW_SALT' '$ch_salt';
            sub_filter 'WEN_POW_DIFF' '$ch_diff';

            sub_filter_once off;        # Заменять все совпадения на странице
            sub_filter_types text/html;  # Работать только с HTML файлами

            # 3. Наш рабочий и изолированный подзапрос к Java-бэкенду
            auth_request /internal_auth_challenge;

            # 4. Перехватываем заголовки ответа из Java
            auth_request_set $skip_ch $upstream_http_x_skip_challenge;
            auth_request_set $ch_salt $upstream_http_x_challenge_salt;
            auth_request_set $ch_diff $upstream_http_x_challenge_difficulty;

            root /usr/share/nginx/html;
            index index.html index.htm;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            try_files $uri $uri/ /index.html;
        }

            location /assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            include /usr/local/openresty/nginx/conf/mime.types;

            # Кэшируем на 1 год! Сборщик Vue гарантирует уникальность имен файлов.
            expires 1y;
            add_header Cache-Control "public, immutable, no-transform";
        }

        # 2. Шрифты (Google Fonts и локальные)
        location ~* \.(?:woff2|woff|ttf|svg|eot)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";

            # Разрешаем CORS для шрифтов, чтобы браузеры не ругались
            add_header Access-Control-Allow-Origin "*";
            log_not_found off;
            access_log off;
        }


        location = /internal_auth_challenge {
            internal; # Запрещает доступ к этому эндпоинту из интернета напрямую

            proxy_pass http://host.docker.internal:8080/api/auth/public/challenge;

            proxy_pass_request_body off; # Экономим трафик, тело запроса для проверки кук не нужно
            proxy_set_header Content-Length "";

            # Базовые заголовки и куки
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Visitor-Id $http_x_visitor_id;
            proxy_set_header X-Visitor-Id2 ""; # Сбрасываем старый, если был

            # ГЕНЕРИРУЕМ ФИНГЕРПРИНТ ДЛЯ ПОДЗАПРОСА (Fast-fail фильтр на Java теперь будет счастлив)
            access_by_lua_block {
                local resty_sha256 = require "resty.sha256"
                local str = require "resty.string"
                local real_ip = ngx.var.remote_addr or "unknown_ip"
                local user_agent = ngx.var.http_user_agent or "unknown_ua"
                local lang = ngx.var.http_accept_language or "unknown_lang"
                local accept = ngx.var.http_accept or "unknown_accept"
                local salt = ngx.var.fingerprint_salt
                local raw_data = real_ip .. "|" .. user_agent .. "|" .. lang .. "|" .. accept .. "|" .. salt
                local sha256 = resty_sha256:new()
                sha256:update(raw_data)
                local digest = sha256:final()
                ngx.req.set_header("X-Visitor-Id2", str.to_hex(digest))
            }

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # PoW Challenge
        location /api/auth/public/challenge {
            limit_req zone=challenge_limit burst=50 nodelay;
            limit_req_status 429;
            proxy_set_header X-Visitor-Id2 "";
            proxy_set_header X-Visitor-Id $http_x_visitor_id;
            proxy_set_header Cookie $http_cookie;

            access_by_lua_block {
                local resty_sha256 = require "resty.sha256"
                local str = require "resty.string"
                local real_ip = ngx.var.remote_addr or "unknown_ip"
                local user_agent = ngx.var.http_user_agent or "unknown_ua"
                local lang = ngx.var.http_accept_language or "unknown_lang"
                local accept = ngx.var.http_accept or "unknown_accept"
                local salt = ngx.var.fingerprint_salt
                local raw_data = real_ip .. "|" .. user_agent .. "|" .. lang .. "|" .. accept .. "|" .. salt
                local sha256 = resty_sha256:new()
                sha256:update(raw_data)
                local digest = sha256:final()
                ngx.req.set_header("X-Visitor-Id2", str.to_hex(digest))
            }

            proxy_pass http://host.docker.internal:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Основное API (Spring Boot в IDEA)
        location /api/ {
            proxy_set_header X-Visitor-Id2 "";
            proxy_set_header X-Visitor-Id $http_x_visitor_id;

            access_by_lua_block {
                local resty_sha256 = require "resty.sha256"
                local str = require "resty.string"
                local real_ip = ngx.var.remote_addr or "unknown_ip"
                local user_agent = ngx.var.http_user_agent or "unknown_ua"
                local lang = ngx.var.http_accept_language or "unknown_lang"
                local accept = ngx.var.http_accept or "unknown_accept"
                local salt = ngx.var.fingerprint_salt
                local raw_data = real_ip .. "|" .. user_agent .. "|" .. lang .. "|" .. accept .. "|" .. salt
                local sha256 = resty_sha256:new()
                sha256:update(raw_data)
                local digest = sha256:final()
                ngx.req.set_header("X-Visitor-Id2", str.to_hex(digest))
            }

            proxy_pass http://host.docker.internal:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Вебсокеты
        location /ws {
            proxy_pass http://host.docker.internal:8080/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Хранилище картинок MinIO
        location /media/ {
            proxy_pass http://host.docker.internal:9000/;
            proxy_set_header Host $proxy_host;
            proxy_set_header Origin "";
            proxy_set_header Authorization "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 50M;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/local/openresty/nginx/html;
        }
    }
}